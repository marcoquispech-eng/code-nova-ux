<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta | Code Nova</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <header class="cabecera">
      <span class="marca">Code Nova</span>
      <span>Registro de estudiantes</span>
    </header>

    <main class="tarjeta">
      <h1>Crea tu cuenta</h1>
      <p class="ayuda">
        Todos los campos son obligatorios. Esta demostración no crea cuentas
        reales. Usa datos de prueba.
      </p>

      <form id="formulario" novalidate>
        <fieldset>
          <legend>1. Datos personales</legend>

          <div class="fila">
            <div class="campo">
              <label for="nombre">Nombre</label>
              <input
                id="nombre"
                name="nombre"
                type="text"
                autocomplete="given-name"
                required
              />
            </div>

            <div class="campo">
              <label for="apellidos">Apellidos</label>
              <input
                id="apellidos"
                name="apellidos"
                type="text"
                autocomplete="family-name"
                required
              />
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>2. Datos de acceso</legend>

          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input
              id="correo"
              name="correo"
              type="email"
              autocomplete="email"
              placeholder="nombre@ejemplo.com"
              required
            />
          </div>

          <div class="campo">
            <label for="clave">Contraseña de prueba</label>
            <p id="ayuda-clave" class="ayuda">
              Usa al menos 8 caracteres. No uses una contraseña real.
            </p>

            <div class="grupo-clave">
              <input
                id="clave"
                type="password"
                autocomplete="new-password"
                minlength="8"
                aria-describedby="ayuda-clave"
                required
              />

              <button
                id="mostrar-clave"
                type="button"
                class="boton-secundario"
                aria-controls="clave"
                aria-pressed="false"
              >
                Mostrar contraseña
              </button>
            </div>
          </div>
        </fieldset>

        <p id="mensaje" class="mensaje" role="status"></p>

        <div class="acciones">
          <button id="registrar" type="submit" class="boton-principal">
            Crear cuenta de prueba
          </button>

          <button type="reset" class="boton-secundario">
            Limpiar formulario
          </button>
        </div>
      </form>
    </main>

    <script src="app.js"></script>
  </body>
</html>
